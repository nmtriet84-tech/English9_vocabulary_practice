<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Ngữ Pháp Tiếng Anh Tương Tác 🚀</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #090d16;
            --sidebar-bg: #111827;
            --card-bg: rgba(22, 30, 49, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #a78bfa, #3b82f6);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --neon-blue: #38bdf8;
            --neon-purple: #c084fc;
            --neon-green: #34d399;
            --neon-red: #f87171;
            --font-display: 'Space Grotesk', sans-serif;
            --font-body: 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(120, 119, 198, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
        }

        /* SIDEBAR LIST OF TOPICS */
        .sidebar {
            width: 340px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, transparent 100%);
        }

        .sidebar-header h2 {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-search-container {
            margin-top: 15px;
            position: relative;
        }

        .sidebar-search-container i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px 10px 38px;
            color: white;
            font-family: var(--font-body);
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        }

        .topics-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .topic-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.01);
        }

        .topic-item:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.06);
            transform: translateX(4px);
        }

        .topic-item.active {
            background: linear-gradient(90deg, rgba(167, 139, 250, 0.15) 0%, rgba(59, 130, 246, 0.1) 100%);
            border-color: rgba(167, 139, 250, 0.3);
        }

        .topic-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 85%;
        }

        .topic-number {
            font-size: 0.75rem;
            color: var(--neon-blue);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .topic-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #e5e7eb;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topic-item.active .topic-title {
            color: #ffffff;
        }

        .topic-status {
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .topic-item.completed .topic-status {
            color: var(--neon-green);
        }

        /* MAIN CONTENT VIEWPORT */
        .viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* NAVBAR */
        .navbar {
            height: 70px;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            flex-shrink: 0;
            z-index: 10;
        }

        .nav-toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.25rem;
            cursor: pointer;
            display: none;
        }

        .navbar-topic-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-topic-info i {
            color: var(--neon-purple);
            font-size: 1.2rem;
        }

        .navbar-topic-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.15rem;
            color: #ffffff;
        }

        .mode-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 4px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-body);
        }

        .mode-btn.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.2);
        }

        /* VIEW CONTAINER */
        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .view-content {
            width: 100%;
            max-width: 800px;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* FLASHCARD DECK STYLE */
        .deck-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .deck-progress-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(17, 24, 39, 0.4);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .deck-progress-text {
            font-family: var(--font-display);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-purple);
        }

        .deck-progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .deck-progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary-gradient);
            border-radius: 10px;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flashcard {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            overflow-y: auto;
            max-height: 550px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .flashcard:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Scrollbar for flashcard */
        .flashcard::-webkit-scrollbar {
            width: 6px;
        }
        .flashcard::-webkit-scrollbar-track {
            background: transparent;
        }
        .flashcard::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        .flashcard::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .flashcard-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .flashcard-title {
            font-family: var(--font-display);
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .flashcard-body {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #cbd5e1;
            white-space: pre-wrap;
            flex: 1;
        }

        .flashcard-body strong {
            font-weight: 700;
            color: #ffffff;
        }

        .flashcard-body em {
            font-style: italic;
            color: var(--neon-blue);
        }

        .flashcard-body ul, .flashcard-body ol {
            margin-bottom: 20px;
            padding-left: 24px;
        }

        .flashcard-body li {
            margin-bottom: 10px;
            color: #cbd5e1;
        }

        .flashcard-body blockquote {
            border-left: 4px solid var(--neon-purple);
            background: rgba(192, 132, 252, 0.05);
            padding: 16px 20px;
            border-radius: 0 16px 16px 0;
            margin: 20px 0;
            color: #d1d5db;
        }

        /* Special parsed tags */
        .lecture-highlight-line {
            background: rgba(56, 189, 248, 0.08);
            border-left: 3px solid var(--neon-blue);
            padding: 12px 18px;
            border-radius: 0 12px 12px 0;
            margin: 14px 0;
            font-weight: 500;
            color: #e0f2fe;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .highlight-emoji {
            font-size: 1.2rem;
        }

        .formula-box {
            padding: 16px 20px;
            border-radius: 16px;
            margin: 16px 0;
            font-weight: 500;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border: 1px solid transparent;
            line-height: 1.6;
        }

        .formula-box.positive {
            background: rgba(52, 211, 153, 0.06);
            border-color: rgba(52, 211, 153, 0.15);
            color: #a7f3d0;
        }

        .formula-box.negative {
            background: rgba(248, 113, 113, 0.06);
            border-color: rgba(248, 113, 113, 0.15);
            color: #fca5a5;
        }

        .formula-box.question {
            background: rgba(167, 139, 250, 0.06);
            border-color: rgba(167, 139, 250, 0.15);
            color: #ddd6fe;
        }

        .box-emoji {
            font-size: 1.2rem;
            margin-top: 1px;
        }

        .deck-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .btn-start-quiz {
            background: linear-gradient(135deg, #34d399, #10b981) !important;
            box-shadow: 0 4px 15px rgba(52, 211, 153, 0.3) !important;
        }
        
        .btn-start-quiz:hover {
            box-shadow: 0 6px 20px rgba(52, 211, 153, 0.5) !important;
            transform: translateY(-2px);
        }

        /* Animations */
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .card-slide-next {
            animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card-slide-prev {
            animation: slideInLeft 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* QUIZ MODE STYLE */
        .quiz-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .quiz-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .quiz-badge {
            background: rgba(167, 139, 250, 0.15);
            color: var(--neon-purple);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid rgba(167, 139, 250, 0.3);
        }

        .quiz-question {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quiz-option {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .quiz-option:hover:not(.locked) {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateX(6px);
        }

        .quiz-option.correct {
            background: rgba(52, 211, 153, 0.12) !important;
            border-color: var(--neon-green) !important;
            color: #a7f3d0;
        }

        .quiz-option.wrong {
            background: rgba(248, 113, 113, 0.12) !important;
            border-color: var(--neon-red) !important;
            color: #fca5a5;
        }

        .quiz-option.correct .option-letter {
            background: var(--neon-green);
            color: #090d16;
        }

        .quiz-option.wrong .option-letter {
            background: var(--neon-red);
            color: #090d16;
        }

        .option-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 14px;
            transition: all 0.2s ease;
        }

        .quiz-explanation-box {
            margin-top: 25px;
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 16px;
            padding: 20px;
            display: none;
            animation: slideIn 0.3s ease-out forwards;
        }

        .quiz-explanation-box h5 {
            font-family: var(--font-display);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--neon-blue);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quiz-explanation-box p {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .quiz-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-next {
            background: var(--primary-gradient);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: none; /* Shown after answer selected */
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-family: var(--font-body);
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
            transition: all 0.2s ease;
        }

        .btn-next:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(167, 139, 250, 0.5);
        }

        /* QUIZ SCORE SCREEN */
        .score-screen {
            text-align: center;
            padding: 40px 20px;
        }

        .score-cup {
            font-size: 4.5rem;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .score-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            margin-bottom: 10px;
        }

        .score-value {
            font-size: 3rem;
            font-weight: 800;
            color: var(--neon-purple);
            margin-bottom: 15px;
            font-family: var(--font-display);
        }

        .score-desc {
            color: var(--text-muted);
            max-width: 450px;
            margin: 0 auto 30px auto;
            font-size: 1rem;
        }

        .score-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        /* Large Primary Action Button */
        .cta-btn {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-body);
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(167, 139, 250, 0.5);
        }

        .cta-btn-outline {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }

        .cta-btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }

        /* RESPONSIVENESS */
        @media (max-width: 900px) {
            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .nav-toggle-btn {
                display: block;
            }

            .view-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR: LESSONS LIST -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2><i class="fa-solid fa-graduation-cap"></i> Ngữ Pháp In Use</h2>
            <div class="sidebar-search-container">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" class="search-input" id="search-box" placeholder="Tìm kiếm mục ngữ pháp..." oninput="filterTopics()">
            </div>
        </div>
        <div class="topics-list" id="topics-list-container">
            <!-- Rendered by JS -->
        </div>
    </aside>

    <!-- MAIN VIEWPORT -->
    <main class="viewport">
        <!-- TOP NAVBAR -->
        <nav class="navbar">
            <div class="navbar-topic-info">
                <button class="nav-toggle-btn" id="sidebar-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                <i class="fa-solid fa-book-open"></i>
                <span class="navbar-topic-title" id="nav-lesson-title">Đang tải bài học...</span>
            </div>
            
            <div class="mode-selector">
                <button class="mode-btn active" id="mode-lecture-btn" onclick="switchMode('lecture')"><i class="fa-solid fa-file-invoice"></i> Bài Giảng</button>
                <button class="mode-btn" id="mode-quiz-btn" onclick="switchMode('quiz')"><i class="fa-solid fa-circle-question"></i> Luyện Tập</button>
            </div>
        </nav>

        <!-- CORE CONTENT VIEWPORT -->
        <div class="view-container">
            <!-- Lecture View Content -->
            <div class="view-content" id="lecture-view">
                <div class="deck-container">
                    <!-- Progress Indicator -->
                    <div class="deck-progress-wrapper">
                        <span class="deck-progress-text" id="deck-progress-text">Thẻ 1 / 5</span>
                        <div class="deck-progress-bar-bg">
                            <div class="deck-progress-bar" id="deck-progress-bar"></div>
                        </div>
                    </div>

                    <!-- Flashcard Body -->
                    <div class="flashcard card-slide-next" id="active-flashcard">
                        <!-- Loaded dynamically -->
                    </div>

                    <!-- Controls -->
                    <div class="deck-controls">
                        <button class="cta-btn cta-btn-outline" id="btn-prev-card" onclick="prevCard()">
                            <i class="fa-solid fa-arrow-left"></i> Trước đó
                        </button>
                        <button class="cta-btn" id="btn-next-card" onclick="nextCard()">
                            Tiếp theo <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Quiz View Content -->
            <div class="view-content" id="quiz-view" style="display: none;">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </main>

    <script>
        let db = []; // Lessons database
        let currentLessonIdx = 0;
        let currentQuestionIdx = 0;
        let quizScore = 0;
        let quizAnswersState = []; // Holds user responses state
        let completedLessons = new Set(JSON.parse(localStorage.getItem('completedLessons') || '[]'));

        const sidebar = document.getElementById('sidebar');

        function toggleSidebar() {
            sidebar.classList.toggle('active');
        }

        // Close sidebar on item click for mobile
        function closeSidebarIfMobile() {
            if (window.innerWidth <= 900) {
                sidebar.classList.remove('active');
            }
        }

        // Fetch JSON data
        fetch('./temp_lop8/gemini_grammar_lessons.json')
            .then(res => res.json())
            .then(data => {
                db = data;
                renderTopicsList();
                loadLesson(0);
            })
            .catch(err => {
                console.error("Lỗi nạp dữ liệu:", err);
                document.getElementById('nav-lesson-title').textContent = "Lỗi kết nối dữ liệu!";
            });

        // Render Sidebar Topics list
        function renderTopicsList() {
            const container = document.getElementById('topics-list-container');
            container.innerHTML = '';

            db.forEach((lesson, idx) => {
                const isCompleted = completedLessons.has(lesson.topic);
                const isActive = idx === currentLessonIdx;

                const item = document.createElement('div');
                item.className = `topic-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}`;
                item.onclick = () => {
                    loadLesson(idx);
                    closeSidebarIfMobile();
                };

                item.innerHTML = `
                    <div class="topic-info">
                        <span class="topic-number">Unit ${idx + 1}</span>
                        <span class="topic-title" title="${lesson.topic}">${lesson.topic}</span>
                    </div>
                    <div class="topic-status">
                        <i class="fa-solid ${isCompleted ? 'fa-circle-check' : 'fa-chevron-right'}"></i>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Filter search topics
        function filterTopics() {
            const searchVal = document.getElementById('search-box').value.toLowerCase().trim();
            const items = document.querySelectorAll('.topic-item');

            db.forEach((lesson, idx) => {
                const match = lesson.topic.toLowerCase().includes(searchVal);
                items[idx].style.display = match ? 'flex' : 'none';
            });
        }

        let activeCards = [];
        let currentCardIndex = 0;

        // Load specific lesson
        function loadLesson(idx) {
            currentLessonIdx = idx;
            currentQuestionIdx = 0;
            quizScore = 0;
            quizAnswersState = [];

            // Update sidebar selection
            const items = document.querySelectorAll('.topic-item');
            items.forEach((item, itemIdx) => {
                item.classList.remove('active');
                if (itemIdx === idx) {
                    item.classList.add('active');
                }
            });

            const lesson = db[idx];
            document.getElementById('nav-lesson-title').textContent = lesson.topic;

            // Split raw lecture text and render first card
            splitIntoCards(lesson.lecture);
            currentCardIndex = 0;
            renderCard('next');

            // Reset view to lecture
            switchMode('lecture');
        }

        // Split raw lecture text into flashcards
        function splitIntoCards(rawText) {
            activeCards = [];
            
            // Check if there are emojis in the text
            const hasEmojis = /(📱|📚|🔍|🧠|🛠|💡|🎬|📖|🚀|📝)/.test(rawText);
            
            if (hasEmojis) {
                // Split by emojis (📱, 📚, 🔍, 🧠, 🛠, 💡, 🎬, 📖, 🚀, 📝) using capture group so the emoji is preserved
                const parts = rawText.split(/(📱|📚|🔍|🧠|🛠|💡|🎬|📖|🚀|📝)/);
                
                // parts[0] is the intro text (before the first emoji)
                if (parts[0] && parts[0].trim().length > 0) {
                    activeCards.push({
                        title: 'Giới thiệu & Tình huống 🎬',
                        body: formatLectureText(parts[0].trim())
                    });
                }
                
                // Subsequent parts are in pairs: [emoji, content]
                for (let i = 1; i < parts.length; i += 2) {
                    const emoji = parts[i];
                    const content = parts[i + 1] || '';
                    
                    let headingText = '';
                    let bodyText = content;
                    
                    const headingEndings = [
                        '"Thực chiến"',
                        '(The Formula)',
                        '(The Rules)',
                        'Cách dùng',
                        '(The Signals)',
                        'Khác biệt cốt lõi',
                        '(The Extensions)',
                        'Tuyệt kỹ Giao tiếp'
                    ];
                    
                    let matchedEnding = null;
                    let minIndex = 999999;
                    
                    for (const ending of headingEndings) {
                        const idx = content.indexOf(ending);
                        if (idx !== -1 && idx < minIndex && idx <= 80) {
                            minIndex = idx;
                            matchedEnding = ending;
                        }
                    }
                    
                    if (matchedEnding) {
                        const cutPoint = minIndex + matchedEnding.length;
                        headingText = content.substring(0, cutPoint).trim();
                        bodyText = content.substring(cutPoint).trim();
                    } else {
                        const firstNewline = content.indexOf('\n');
                        if (firstNewline !== -1 && firstNewline < 80) {
                            headingText = content.substring(0, firstNewline).trim();
                            bodyText = content.substring(firstNewline).trim();
                        } else {
                            headingText = content.substring(0, 30).trim() + '...';
                            bodyText = content;
                        }
                    }
                    
                    const title = `${emoji} ${headingText}`;
                    activeCards.push({
                        title: title,
                        body: formatLectureText(bodyText)
                    });
                }
            } else {
                // Split by numbered headings like "1. ", "2. "
                // The pattern looks for a number at the start of a line
                const parts = rawText.split(/(?:\n|^)(?=\d+\.\s+)/);
                
                // parts[0] is the intro text
                if (parts[0] && parts[0].trim().length > 0) {
                    activeCards.push({
                        title: 'Giới thiệu & Tình huống 🎬',
                        body: formatLectureText(parts[0].trim())
                    });
                }
                
                // Subsequent parts start with "X. heading\nbody"
                for (let i = 1; i < parts.length; i++) {
                    const content = parts[i].trim();
                    if (!content) continue;
                    
                    const firstNewline = content.indexOf('\n');
                    let headingText = '';
                    let bodyText = content;
                    
                    if (firstNewline !== -1) {
                        headingText = content.substring(0, firstNewline).trim();
                        bodyText = content.substring(firstNewline).trim();
                    } else {
                        headingText = content.substring(0, 40).trim() + '...';
                    }
                    
                    activeCards.push({
                        title: `📖 ${headingText}`,
                        body: formatLectureText(bodyText)
                    });
                }
            }
            
            // Fallback
            if (activeCards.length === 0) {
                activeCards.push({
                    title: 'Bài Giảng 📖',
                    body: formatLectureText(rawText)
                });
            }
        }

        // Render current flashcard content with dynamic sliding transitions
        function renderCard(direction = 'next') {
            const activeFlashcard = document.getElementById('active-flashcard');
            const prevBtn = document.getElementById('btn-prev-card');
            const nextBtn = document.getElementById('btn-next-card');
            const progressText = document.getElementById('deck-progress-text');
            const progressBar = document.getElementById('deck-progress-bar');
            
            if (activeCards.length === 0) return;
            
            // Remove existing transition classes
            activeFlashcard.classList.remove('card-slide-next', 'card-slide-prev');
            
            // Force reflow to restart animation
            void activeFlashcard.offsetWidth;
            
            // Set card content
            const cardData = activeCards[currentCardIndex];
            activeFlashcard.innerHTML = `
                <div class="flashcard-header">
                    <h3 class="flashcard-title">${cardData.title}</h3>
                </div>
                <div class="flashcard-body">${cardData.body}</div>
            `;
            
            // Add transition class based on direction
            if (direction === 'next') {
                activeFlashcard.classList.add('card-slide-next');
            } else {
                activeFlashcard.classList.add('card-slide-prev');
            }
            
            // Update progress text & bar
            progressText.textContent = `Thẻ ${currentCardIndex + 1} / ${activeCards.length}`;
            const progressPercent = ((currentCardIndex + 1) / activeCards.length) * 100;
            progressBar.style.width = `${progressPercent}%`;
            
            // Handle Navigation Buttons state
            if (currentCardIndex === 0) {
                prevBtn.style.visibility = 'hidden';
                prevBtn.style.opacity = '0';
                prevBtn.style.pointerEvents = 'none';
            } else {
                prevBtn.style.visibility = 'visible';
                prevBtn.style.opacity = '1';
                prevBtn.style.pointerEvents = 'auto';
            }
            
            if (currentCardIndex === activeCards.length - 1) {
                nextBtn.innerHTML = `Luyện tập <i class="fa-solid fa-bolt"></i>`;
                nextBtn.classList.add('btn-start-quiz');
            } else {
                nextBtn.innerHTML = `Tiếp theo <i class="fa-solid fa-arrow-right"></i>`;
                nextBtn.classList.remove('btn-start-quiz');
            }
        }

        function nextCard() {
            if (currentCardIndex < activeCards.length - 1) {
                currentCardIndex++;
                renderCard('next');
            } else {
                // Switch to quiz mode at the end of the deck
                switchMode('quiz');
            }
        }

        function prevCard() {
            if (currentCardIndex > 0) {
                currentCardIndex--;
                renderCard('prev');
            }
        }

        // Basic Markdown-to-HTML parser helper for lecture text with customized alert block wrappers
        function formatLectureText(text) {
            let html = text
                // Bold: **text** -> <strong>text</strong>
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                // Italic: *text* or _text_ -> <em>text</em>
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
            
            // Split lines to process custom bullet points and stylized cards
            const lines = html.split('\n');
            const processedLines = lines.map(line => {
                const trimmed = line.trim();
                if (trimmed.startsWith('👉')) {
                    return `<div class="lecture-highlight-line"><span class="highlight-emoji">👉</span> ${trimmed.substring(2).trim()}</div>`;
                }
                if (trimmed.startsWith('✅')) {
                    return `<div class="formula-box positive"><span class="box-emoji">✅</span> ${trimmed.substring(2).trim()}</div>`;
                }
                if (trimmed.startsWith('❌')) {
                    return `<div class="formula-box negative"><span class="box-emoji">❌</span> ${trimmed.substring(2).trim()}</div>`;
                }
                if (trimmed.startsWith('❓')) {
                    return `<div class="formula-box question"><span class="box-emoji">❓</span> ${trimmed.substring(2).trim()}</div>`;
                }
                if (trimmed.startsWith('-') || trimmed.startsWith('•')) {
                    return `<li>${trimmed.substring(1).trim()}</li>`;
                }
                return line;
            });
            
            html = processedLines.join('\n');

            // Wrap contiguous list items in <ul>
            html = html.replace(/(<li>.*?<\/li>\s*)+/g, (match) => `<ul>${match}</ul>`);

            // Headers
            html = html.replace(/^(?:#+)\s*(.*?)$/gm, '<h3>$1</h3>');
            html = html.replace(/^(?:\d+\.\s+)(.*?)$/gm, '<h3>$1</h3>');

            return html;
        }

        // Listen for keyboard navigation
        document.addEventListener('keydown', (e) => {
            const lectureView = document.getElementById('lecture-view');
            if (lectureView && lectureView.style.display !== 'none') {
                if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
                    return;
                }
                if (e.key === 'ArrowRight') {
                    nextCard();
                } else if (e.key === 'ArrowLeft') {
                    prevCard();
                }
            }
        });

        // Switch View Modes (Lecture vs Quiz)
        function switchMode(mode) {
            const lectureBtn = document.getElementById('mode-lecture-btn');
            const quizBtn = document.getElementById('mode-quiz-btn');
            const lectureView = document.getElementById('lecture-view');
            const quizView = document.getElementById('quiz-view');

            if (mode === 'lecture') {
                lectureBtn.classList.add('active');
                quizBtn.classList.remove('active');
                lectureView.style.display = 'block';
                quizView.style.display = 'none';
            } else {
                lectureBtn.classList.remove('active');
                quizBtn.classList.add('active');
                lectureView.style.display = 'none';
                quizView.style.display = 'block';
                
                // Initialize/Load Quiz questions
                loadQuizQuestion();
            }
        }

        // Shuffles options and tracks the correct index
        function shuffleOptions(options, correctLetter) {
            // For these lessons, the correct answer is always at index 0 (Option A)
            const correctText = options[0];
            
            // Create option objects
            const list = options.map((opt, idx) => ({
                text: opt,
                isCorrect: idx === 0
            }));

            // Shuffle list
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }

            return list;
        }

        // Load active Quiz Question
        function loadQuizQuestion() {
            const lesson = db[currentLessonIdx];
            const quizView = document.getElementById('quiz-view');

            if (currentQuestionIdx >= lesson.quiz.length) {
                showFinalScoreScreen();
                return;
            }

            const currentQ = lesson.quiz[currentQuestionIdx];
            
            // Shuffle choices dynamically so the answer isn't always A for the user
            const shuffledChoices = shuffleOptions(currentQ.options, currentQ.correct_answer);

            const letters = ['A', 'B', 'C', 'D'];

            quizView.innerHTML = `
                <div class="quiz-card">
                    <div class="quiz-card-header">
                        <span class="quiz-badge">Câu hỏi ${currentQuestionIdx + 1}/${lesson.quiz.length}</span>
                        <span>Trắc Nghiệm Kiến Thức</span>
                    </div>
                    <p class="quiz-question">${currentQ.question}</p>
                    <div class="quiz-options">
                        ${shuffledChoices.map((choice, idx) => `
                            <div class="quiz-option" data-correct="${choice.isCorrect}" onclick="handleOptionSelect(this, ${choice.isCorrect})">
                                <div>
                                    <span class="option-letter">${letters[idx]}</span>
                                    <span class="option-text">${choice.text}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="quiz-explanation-box" id="explanation-box">
                        <h5><i class="fa-solid fa-circle-info"></i> Giải Thích Chi Tiết</h5>
                        <p>${currentQ.explanation || 'Đáp án đúng là phương án được chọn. Hãy ghi nhớ kiến thức vừa được giảng giải nhé!'}</p>
                    </div>

                    <div class="quiz-actions">
                        <button class="btn-next" id="btn-next" onclick="nextQuestion()">
                            Tiếp theo <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // Handle answer selection
        function handleOptionSelect(el, isCorrect) {
            // Lock further clicks on options
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(opt => opt.classList.add('locked'));

            // Show color feedback
            if (isCorrect) {
                el.classList.add('correct');
                quizScore++;
            } else {
                el.classList.add('wrong');
                // Highlight correct option
                const correctOpt = Array.from(options).find(opt => opt.getAttribute('data-correct') === 'true');
                if (correctOpt) {
                    correctOpt.classList.add('correct');
                }
            }
            
            // Show explanation box
            const expBox = document.getElementById('explanation-box');
            expBox.style.display = 'block';

            // Show Next Button
            const nextBtn = document.getElementById('btn-next');
            nextBtn.style.display = 'inline-flex';
        }

        function nextQuestion() {
            currentQuestionIdx++;
            loadQuizQuestion();
        }

        // Show Final Score Screen
        function showFinalScoreScreen() {
            const lesson = db[currentLessonIdx];
            const quizView = document.getElementById('quiz-view');
            const percent = Math.round((quizScore / lesson.quiz.length) * 100);

            // Save completion to LocalStorage
            if (percent >= 70) {
                completedLessons.add(lesson.topic);
                localStorage.setItem('completedLessons', JSON.stringify(Array.from(completedLessons)));
                renderTopicsList(); // Refresh checkmark status
            }

            let titleMsg = "Cố gắng hơn nữa nhé!";
            let icon = "🎯";
            let color = "var(--neon-blue)";
            
            if (percent === 100) {
                titleMsg = "Tuyệt đối! Bạn quá xuất sắc! 👑";
                icon = "🏆";
                color = "var(--neon-green)";
                triggerScoreConfetti();
            } else if (percent >= 70) {
                titleMsg = "Chúc mừng! Bạn đã Đạt chủ đề này! 🎉";
                icon = "✨";
                color = "var(--neon-purple)";
                triggerScoreConfetti();
            }

            quizView.innerHTML = `
                <div class="quiz-card score-screen">
                    <div class="score-cup">${icon}</div>
                    <h2 class="score-title" style="color: ${color}">${titleMsg}</h2>
                    <div class="score-value">${quizScore}/${lesson.quiz.length}</div>
                    <p class="score-desc">Bạn đã trả lời đúng ${quizScore} trên tổng số ${lesson.quiz.length} câu hỏi (${percent}%). ${percent >= 70 ? 'Unit này đã được đánh dấu hoàn thành!' : 'Bạn cần đạt tối thiểu 70% (đúng 5/7 câu) để vượt qua Unit này.'}</p>
                    
                    <div class="score-actions">
                        <button class="cta-btn cta-btn-outline" onclick="restartLessonQuiz()"><i class="fa-solid fa-rotate-right"></i> Làm lại Quiz</button>
                        ${currentLessonIdx + 1 < db.length ? 
                            `<button class="cta-btn" onclick="loadNextLesson()"><i class="fa-solid fa-forward"></i> Bài Học Tiếp Theo</button>` : 
                            `<button class="cta-btn" onclick="switchMode('lecture')"><i class="fa-solid fa-house"></i> Ôn Tập Bài Giảng</button>`
                        }
                    </div>
                </div>
            `;
        }

        function restartLessonQuiz() {
            currentQuestionIdx = 0;
            quizScore = 0;
            loadQuizQuestion();
        }

        function loadNextLesson() {
            loadLesson(currentLessonIdx + 1);
        }

        function triggerScoreConfetti() {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        }
    </script>
